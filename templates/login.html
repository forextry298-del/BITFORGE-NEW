{% extends "base.html" %}
{% block title %}Sign in · BitForge{% endblock %}
{% block body %}
<main class="auth-page auth-dark-page auth-login-page">
  <div class="auth auth-dark">
    <div class="auth-head">
      <img class="auth-logo auth-logo-image" src="{{ url_for('static',filename='images/bitforge_robot_logo.webp') }}" alt="BitForge logo">
      <h1>Welcome Back</h1>
      <div class="sub">Sign in to your BitForge account.</div>
    </div>
    <form class="auth-panel auth-dark-panel" method="post" autocomplete="on">
      <div class="field"><label>COUNTRY</label><select aria-label="Country"><option>🇺🇬 Uganda</option></select></div>
      <div class="field"><label>PHONE NUMBER</label><div class="phone-entry"><span>+256</span><input name="phone" type="tel" inputmode="numeric" placeholder="700123456" required autocomplete="tel-national" pattern="[0-9 ]{9,12}" title="Enter your 9-digit Ugandan mobile number"></div></div>
      <div class="field"><label>PASSWORD</label><div class="password-entry"><input id="login-password" name="password" type="password" placeholder="Enter password" required autocomplete="current-password"><button type="button" class="show-password" onclick="toggleAuthPassword('login-password',this)">SHOW</button></div></div>
      {% with messages=get_flashed_messages() %}{% for m in messages %}<div class="flash {% if 'success' in m|lower or 'successful' in m|lower or 'approved' in m|lower or 'credited' in m|lower %}flash-success{% elif 'failed' in m|lower or 'incorrect' in m|lower or 'insufficient' in m|lower or 'error' in m|lower or 'rejected' in m|lower or 'already registered' in m|lower %}flash-error{% endif %}">{{ m }}</div>{% endfor %}{% endwith %}
      <button class="btn full auth-submit" type="submit">Sign In</button>
      <div class="auth-foot">Don't have an account? <a href="{{url_for('register')}}">Create one</a></div>
    </form>
  </div>
</main>
<script>function toggleAuthPassword(id,button){const field=document.getElementById(id);if(!field)return;const showing=field.type==='text';field.type=showing?'password':'text';button.textContent=showing?'SHOW':'HIDE';}</script>
{% endblock %}
