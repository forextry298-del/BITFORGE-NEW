{% extends "base.html" %}{% block title %}Sign in · BitForge{% endblock %}{% block body %}<main class="auth-page"><div class="auth"><div class="auth-head"><div class="auth-logo">B</div><h1>Welcome Back</h1><div class="sub">Sign in to your BitForge account.</div></div><form class="auth-panel" method="post"><div class="field"><label>COUNTRY</label><select><option>🇺🇬 Uganda</option></select></div><div class="field"><label>PHONE NUMBER</label><input name="phone" type="tel" placeholder="+256 700123456" required autocomplete="tel"></div><div class="field"><label>PASSWORD</label><input name="password" type="password" placeholder="Enter password" required></div>{% with messages=get_flashed_messages() %}{% for m in messages %}<div class="flash">{{m}}</div>{% endfor %}{% endwith %}<button class="btn full" type="submit">Sign In</button><div class="auth-foot">Don't have an account? <a href="{{url_for('register')}}">Create one</a></div></form></div></main>{% endblock %}
