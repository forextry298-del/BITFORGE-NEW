{% extends "base.html" %}{% block content %}
<section class="auth"><div class="authicon">B</div><h1>Create account</h1><p class="muted">Register for your BitForge account.</p>
<form method="post" class="panel">
<label>Full name</label><input name="full_name" placeholder="Enter your full name" required>
<label>Country</label><select name="country"><option>Uganda</option><option>Kenya</option><option>Tanzania</option><option>Rwanda</option></select>
<label>Phone number</label><div class="phone"><b>+256</b><input name="phone" placeholder="700123456" required></div>
<label>Password</label><input type="password" name="password" placeholder="At least 6 characters" minlength="6" required>
<button class="primary">Create account</button><p class="switch">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p></form></section>{% endblock %}
