<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f6fa"><title>{% block title %}BitForge{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head>
<body>
<header class="topbar"><a class="brand" href="{{ url_for('home') }}"><span class="brand-mark">B</span>BitForge</a><button class="menu-toggle" id="menuToggle">☰</button><div class="menu-panel" id="menuPanel"><b>MENU</b><a href="{{ url_for('account') }}">♙　Profile &amp; Settings</a><button id="darkToggle">☾　Dark Mode</button></div></header>
<main class="page-shell">{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main>
<nav class="bottom-nav"><a href="{{ url_for('home') }}" class="{% if request.endpoint=='home' %}active{% endif %}"><i>⌂</i><small>Home</small></a><a href="{{ url_for('market') }}"><i>⌕</i><small>Search</small></a><a class="market-nav" href="{{ url_for('market') }}"><i>▣</i><small>Market</small></a><a href="{{ url_for('orders') }}"><i>▤</i><small>Orders</small></a><a href="{{ url_for('account') }}"><i>♙</i><small>Account</small></a></nav>
<script>
const mt=document.getElementById('menuToggle'),mp=document.getElementById('menuPanel');mt.onclick=()=>mp.classList.toggle('show');
document.getElementById('darkToggle').onclick=()=>{document.body.classList.toggle('dark-mode');localStorage.setItem('bf-dark',document.body.classList.contains('dark-mode')?'1':'0')};
if(localStorage.getItem('bf-dark')==='1')document.body.classList.add('dark-mode');
document.addEventListener('click',e=>{if(!mp.contains(e.target)&&!mt.contains(e.target))mp.classList.remove('show')});
</script>{% block scripts %}{% endblock %}</body></html>
